# -- Unbind Keys -------------------------------------------
unbind C-b
unbind '"'
unbind %
unbind w
unbind C-P


# -- Bind Keys ----------------------------------------------
bind-key w command-prompt -p "window name:" "new-window; rename-window '%%'"
bind-key n command-prompt -p "Session name:" "new-session -s '%%'"
bind-key C-n next-window
bind-key C-p previous-window
bind-key C-a send-prefix
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Docker
bind-key G display-popup -E 'image=$(docker image ls --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>" | fzf) || exit; [ -n "$image" ] || exit; tmux split-window -h -c "#{pane_current_path}" "docker run --rm -it -v \"$HOME:/opt/host_home\" --entrypoint /bin/sh \"$image\""'
# Pane
bind - split-window -v -c "#{pane_current_path}"
bind x run-shell '~/.config/tmux/scripts/safe-kill-pane "#{pane_id}" "#{pane_pid}"'
bind z resize-pane -Z \; display-message 'Zoom: #{?window_zoomed_flag,on,off}'
# Editing and reloading configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
# Help popup with all keybinds
bind-key ? display-popup -T "Key bindings" -w 90% -h 80% -E 'tmux list-keys -T prefix | fzf --reverse --no-sort --prompt="Bindings > " --header="Ctrl-a prefix bindings"'
# Mouse
bind m if -F '#{mouse}' 'set -g mouse off \; display-message "Mouse: off"' 'set -g mouse on \; display-message "Mouse: on"'
set -g mouse on

# Route wheel events to the pane underneath the pointer. Applications using
# the alternate screen (K9s, Vim, less, etc.) receive their native mouse
# events; regular shells enter copy mode and scroll only their own history.
bind-key -n WheelUpPane select-pane -t= \; if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'
bind-key -n WheelDownPane select-pane -t= \; if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' 'send-keys -M' 'if-shell -F "#{pane_in_mode}" "send-keys -X -N 3 scroll-down" "send-keys -M"'
bind-key -T copy-mode-vi WheelUpPane select-pane -t= \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane -t= \; send-keys -X -N 3 scroll-down
bind-key -T copy-mode WheelUpPane select-pane -t= \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode WheelDownPane select-pane -t= \; send-keys -X -N 3 scroll-down

set -g pane-scrollbars modal
set -g pane-scrollbars-style "fg=#7dcfff,bg=#3b4261,width=1,pad=0"
# Popup key bindings
bind A display-popup -T "Developer Tools" -w 95% -h 90% -d "#{pane_current_path}" -E '~/.config/tmux/scripts/developer-tools'
bind P display-popup -T "scratch" -w 90% -h 80% -d "#{pane_current_path}" -E 'TMUX= tmux new-session -A -s scratch'
bind s display-popup -T "Sessions" -w 80% -h 70% -E '~/.config/tmux/scripts/session-picker'
bind S choose-tree -Zw
bind Space display-popup -T "Layouts" -w 50% -h 55% -E '~/.config/tmux/scripts/layout-picker'
bind p display-popup -T "Projects" -w 85% -h 80% -E '~/.config/tmux/scripts/project-picker'
bind F run-shell '~/.config/tmux/scripts/focus-mode'
bind g display-popup -T "LazyGit" -w 95% -h 90% -d "#{pane_current_path}" -E 'lazygit'
bind b display-popup -T "System monitor" -w 95% -h 90% -E 'btop'
bind f display-popup -T "Find file" -w 90% -h 85% -d "#{pane_current_path}" -E 'file=$(fd --type f --hidden --exclude .git | fzf --reverse --preview "sed -n 1,200p {}" --prompt="Open file > ") || exit; [ -n "$file" ] && "${EDITOR:-vim}" "$file"'
bind v display-popup -T "Tmux buffers" -w 80% -h 70% -E '~/.config/tmux/scripts/buffer-picker'
bind e display-popup -T "Edit tmux.conf" -w 95% -h 90% -E '"${EDITOR:-vim}" ~/.config/tmux/tmux.conf && tmux source-file ~/.config/tmux/tmux.conf'
bind / display-popup -T "Command palette" -w 60% -h 70% -d "#{pane_current_path}" -E '~/.config/tmux/scripts/command-palette'



# -- Basic Settings ------------------------------------------
set -g prefix C-a
set -sg escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string "tmux: #S:#I #W"
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 30
set -g status-justify centre
set -g status-left "#[fg=#7dcfff,bg=#16161e]#[fg=#16161e,bg=#7dcfff,bold] 󰆍 #S #[fg=#7dcfff,bg=#16161e,nobold] #[fg=#bb9af7] #[fg=#c0caf5]#{b:pane_current_path} #{?window_zoomed_flag,#[fg=#e0af68]󰁌 ZOOM ,}#[default]"
set -g status-left-length 60
set -g status-right "#{prefix_highlight}#[default] #(~/.config/tmux/scripts/status-context '#{client_width}' '#{pane_current_path}' '#{pane_pid}' '#{pane_current_command}')#[fg=#9ece6a,bg=#16161e]#[fg=#16161e,bg=#9ece6a,bold] %H:%M #[fg=#9ece6a,bg=#16161e,nobold] #[fg=#565f89] %a %d %b #[default]"
set -g status-right-length 100

# -- Tokyo Night Theme
set -g status-style bg=#16161e,fg=#c0caf5
set -g window-style fg=default,bg=#17181c
set -g window-active-style fg=default,bg=#000000
set -g pane-border-style fg=#3b4261
set -g pane-active-border-style fg=#7dcfff,bold
set -g message-style bg=#24283b,fg=#9ece6a,bold
set -g message-command-style bg=#24283b,fg=#7dcfff
set -g mode-style bg=#e0af68,fg=#16161e,bold
set -g popup-style bg=#16161e,fg=#c0caf5
set -g popup-border-style fg=#7dcfff
set -g menu-style bg=#16161e,fg=#c0caf5
set -g menu-selected-style bg=#7dcfff,fg=#16161e,bold
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89,bg=#16161e]  #I #W#F  "
setw -g window-status-current-format "#[fg=#7dcfff,bg=#16161e]#[fg=#16161e,bg=#7dcfff,bold] #I #W#F #[fg=#7dcfff,bg=#16161e,nobold]"
setw -g window-status-activity-style fg=#e0af68,bold
setw -g window-status-bell-style fg=#f7768e,bold

# -- Plugins -----------------------------------------------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sidebar'

# Plugin configuration
set -g @prefix_highlight_fg '#16161e'
set -g @prefix_highlight_bg '#bb9af7'
set -g @prefix_highlight_output_prefix ''
set -g @prefix_highlight_output_suffix ''
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#16161e,bg=#e0af68,bold'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=#16161e,bg=#f7768e,bold'
set -g @override_copy_command '~/.config/tmux/scripts/copy-text'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


# -- Synchronize panes with color change -----------------------
bind a if-shell -F '#{pane_synchronized}' \
'set -w synchronize-panes off ; set -w window-style fg=default,bg=#17181c ; set -w window-active-style fg=default,bg=#000000 ; set -w pane-border-style fg=#3b4261,bg=default ; set -w pane-active-border-style fg=#7dcfff,bg=default,bold ; display-message "Synchronize panes: off"' \
'set -w synchronize-panes on ; set -w window-style fg=default,bg=#241419 ; set -w window-active-style fg=default,bg=#2d171e ; set -w pane-border-style fg=#6b2737,bg=#241419 ; set -w pane-active-border-style fg=#f7768e,bg=#2d171e,bold ; display-message "Synchronize panes: on"'

# Right-click menu with direct macOS clipboard support
bind -n MouseDown3Pane display-menu -T "Pane #{pane_index}" -t = -x M -y M \
    "Copy word" w { run-shell -b "~/.config/tmux/scripts/copy-text #{q:mouse_word}" } \
    "Copy line" l { run-shell -b "~/.config/tmux/scripts/copy-text #{q:mouse_line}" } \
    "Paste" p { paste-buffer } \
    '' \
    "Horizontal split" h { split-window -h -c "#{pane_current_path}" } \
    "Vertical split" v { split-window -v -c "#{pane_current_path}" } \
    "Zoom" z { resize-pane -Z } \
    '' \
    "Kill pane" x { confirm-before -p "Kill pane? (y/n)" kill-pane }

# Notify when a pane process exits
set-hook -g pane-died 'run-shell -b "~/.config/tmux/scripts/notify-pane-death #{pane_dead_status} #{q:session_name}:#{window_index}.#{pane_index} #{q:pane_start_command}"'


if "test ! -d ~/.config/tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run -b '~/.config/tmux/plugins/tpm/tpm'
